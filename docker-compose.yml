services:
  goqlprinter:
    build: .
    ports:
      - "8000:8000"
    environment:
      LABELPRINTER_SERVER_HOST: "0.0.0.0"
      LABELPRINTER_SERVER_PORT: "8000"
    restart: unless-stopped
    volumes:
      - ./config/config.json:/app/config/config.json:ro
      # USB (Linux only): uncomment next line and add privileged: true below
      # - /dev:/dev
    # privileged: true
